<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lodestone</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="ld-app-bg">
  <!-- Inline icon set (Lucide-style, the closest match to SF Symbols) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></symbol>
      <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
      <symbol id="i-server" viewBox="0 0 24 24"><path d="M3 5h18v6H3zM3 13h18v6H3zM7 8h.01M7 16h.01"/></symbol>
      <symbol id="i-game" viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 11h.01M18 13h.01M3 16l2-7a3 3 0 0 1 3-2h8a3 3 0 0 1 3 2l2 7a2 2 0 0 1-3.6 1.5L17 14H7l-1.4 3.5A2 2 0 0 1 3 16z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L16 2H8l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 3 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1c.6.5 1.3.9 2 1.2L8 22h8l.5-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></symbol>
      <symbol id="i-infinity" viewBox="0 0 24 24"><path d="M6 16c-2.2 0-4-1.8-4-4s1.8-4 4-4c3 0 5 8 8 8 2.2 0 4-1.8 4-4s-1.8-4-4-4c-3 0-5 8-8 8z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18A14 14 0 0 1 12 3z"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.2a3.4 3.4 0 0 1 0 6.4M17.5 15.4c2 .7 3.5 2.2 3.5 4.6"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
      <!-- [Crash Doctor] heartbeat/pulse icon -->
      <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 4.5 14 2.5-7H21"/></symbol>
      <!-- [Design overhaul] the lodestone compass: brand ring + the needle motif -->
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6l2.3 6-2.3 6-2.3-6z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-needle" viewBox="0 0 24 24"><path d="M12 2l3.3 10h-6.6z" fill="currentColor" stroke="none"/><path d="M12 22l3.3-10h-6.6z" fill="currentColor" opacity=".35" stroke="none"/></symbol>
      <!-- [Voxel] art drop-target + the settings sliders beside Play -->
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-6 6-3-3-4 4"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></symbol>
      <symbol id="i-slash" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-mark" viewBox="0 0 24 24"><path d="M12 4l7 16-7-4-7 4z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg class="ico"><use href="#i-mark"/></svg></span>
        <span class="brand-name">Lodestone</span>
      </div>

      <!-- Voxel sidebar: four destinations, then PINNED, then SETUP. The
           compass-needle indicator is gone (Deepslate-only), and Discover
           left the rail — mods are added from an instance, as on Mac. -->
      <nav class="nav">
        <button class="nav-item is-active" data-section="home"><svg class="ico"><use href="#i-play"/></svg><span>Play</span></button>
        <button class="nav-item" data-section="instances"><svg class="ico"><use href="#i-grid"/></svg><span>Instances</span></button>
        <button class="nav-item" data-section="servers"><svg class="ico"><use href="#i-server"/></svg><span>Servers</span></button>
        <button class="nav-item" data-section="friends"><svg class="ico"><use href="#i-users"/></svg><span>Friends</span></button>
      </nav>

      <!-- Populated from pinned instances (falls back to most-played). -->
      <div id="pinned-block"></div>

      <div class="nav-group">Setup</div>
      <nav class="nav">
        <button class="nav-item" data-section="game"><svg class="ico"><use href="#i-game"/></svg><span>Game settings</span></button>
        <button class="nav-item" data-section="skins"><svg class="ico"><use href="#i-user"/></svg><span>Skins</span></button>
        <button class="nav-item" data-section="keybinds"><svg class="ico"><use href="#i-keyboard"/></svg><span>Keybinds</span></button>
      </nav>

      <div class="account" id="account"></div>
    </aside>

    <!-- Content -->
    <main class="content" id="content"></main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="update-banner" class="update-banner" hidden></div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="modal" class="modal-root" hidden></div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
